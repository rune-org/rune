name: DSL CI

on:
  push:
    branches: [main]
    paths:
      - "dsl/**"
  pull_request:
    branches: [main]
    paths:
      - "dsl/**"

concurrency:
  group: dsl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: DSL tests (Python, TypeScript, Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.6.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dsl/tests/ts/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"

      - name: Run DSL Python tests
        run: |
          cd dsl && uv sync && PYTHONPATH=.. uv run pytest tests/python -v

      - name: Run DSL TypeScript tests
        run: |
          cd dsl/tests/ts && pnpm install && pnpm test

      - name: Run DSL Go tests
        run: |
          cd dsl/tests/go && go test ./... -v
